name: Nextflow CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: latest-stable

      - name: Run test profile
        run: nextflow run main.nf -profile test
